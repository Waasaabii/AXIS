name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0-test.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-web-binary:
    name: Linux single binary with embedded Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Package release
        run: pnpm run package:release -- --version "${{ github.event.inputs.version || github.ref_name }}" --goos linux --goarch amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-linux-amd64
          path: dist/release/*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/release/*.tar.gz
          generate_release_notes: true
