# ============================================================================
#  AXIS 配置文件模板
#  核心模型：节点来源 → 线路组合 → 使用 / 发布
# ============================================================================

server:
  host: 0.0.0.0
  port: 8787
  startup_refresh: false

admin:
  username: admin
  password: ""
  password_hash: ""
  session_secret: ""
  session_ttl_hours: 12

runtime:
  workdir: ../runtime
  mihomo_binary: mihomo
  external_controller: http://127.0.0.1:9090
  external_secret: ""
  render_only: true

node_sources:
  - name: my-airport
    type: subscription
    enabled: true
    protocol: mihomo-http
    subscription:
      url: https://example.com/your-subscription-url
      interval: 3600
      health_check_url: https://www.gstatic.com/generate_204
      health_check_interval: 300

  - name: landing-socks
    type: proxy
    enabled: false
    protocol: socks5
    endpoint:
      server: landing.example.com
      port: 1080
      username: user
      password: change-me

routes:
  - name: hk-daily
    enabled: true
    entry:
      source: my-airport
      node: "(?i)港|hk|hong ?kong"
    strategy: manual
    health_check:
      url: https://www.gstatic.com/generate_204
      interval: 300

usage:
  selected_route: hk-daily
  local_proxy:
    enabled: true
    type: mixed
    listen: 127.0.0.1
    port: 7890
    users: []
  virtual_interface:
    enabled: false
    mode: system

publications:
  - name: hk-for-lan
    type: http_proxy
    enabled: false
    route: hk-daily
    listen: 0.0.0.0
    port: 10801
    access_scope: lan
    format: url
    auth:
      username: user_hk
      password: change-me
